name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
      - name: Install workspace
        working-directory: rxnbench/backend
        run: uv sync
      - name: Gantry tests
        working-directory: rxnbench/backend
        run: make test-gantry
      - name: pH tests
        working-directory: rxnbench/backend
        run: make test-ph
      - name: Camera tests
        working-directory: rxnbench/backend
        run: make test-camera
      - name: Dosing pump tests
        working-directory: rxnbench/backend
        run: make test-pump
      - name: Client tests
        working-directory: rxnbench/backend
        run: make test-client
      - name: Proto drift check
        working-directory: rxnbench/backend
        run: make check-proto

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install frontend
        working-directory: rxnbench/frontend
        run: uv sync
      - name: Generated-connection drift check
        working-directory: rxnbench/frontend
        run: make check-connections
      - name: Frontend tests
        working-directory: rxnbench/frontend
        run: make test
