[project]
name = "rxn-bench-atlas-ezo-pmp-driver"
version = "0.1.0"
description = "Atlas Scientific EZO-PMP dosing pump driver for the rxn-bench-dosing-pump capability."
requires-python = ">=3.10"
dependencies = [
    "rxn-bench-dosing-pump",
]

[project.optional-dependencies]
rpi = ["pyserial>=3.5"]

[project.entry-points."rxn_bench.dosing_pump_drivers"]
atlas_ezo_pmp = "rxn_bench_atlas_ezo_pmp_driver:build_pump"
atlas_ezo_pmp_mock = "rxn_bench_atlas_ezo_pmp_driver:build_mock_pump"

[tool.uv.sources]
rxn-bench-dosing-pump = { path = "../../capability/backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_atlas_ezo_pmp_driver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament-lint",
    "-p", "no:ament-copyright",
    "-p", "no:ament-flake8",
    "-p", "no:ament-pep257",
    "-p", "no:ament-xmllint",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = "rxn_bench_atlas_ezo_pmp_driver"

[tool.coverage.run]
branch = true
source = ["rxn_bench_atlas_ezo_pmp_driver"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
disallow_untyped_defs = true
exclude = ["tests/", "docs/"]

[[tool.mypy.overrides]]
module = ["serial.*", "rxn_bench_dosing_pump.*"]
ignore_missing_imports = true
