[project]
name = "rxn-bench-dosing-pump"
version = "0.1.0"
description = "Dosing pump SiLA2 server capability - hardware-agnostic; see rxn-bench-atlas-ezo-pmp-driver for the reference driver."
requires-python = ">=3.10"
dependencies = [
    "unitelabs-cdk",
    "rxn-bench-atlas-ezo-pmp-driver",
]

[project.optional-dependencies]
# Passthrough to the default driver's own rpi extra (real EZO-PMP serial
# transport; not needed for the mock path, which uses a protocol emulator).
rpi = ["rxn-bench-atlas-ezo-pmp-driver[rpi]"]

[tool.uv.sources]
rxn-bench-atlas-ezo-pmp-driver = { path = "../../driver/backend", editable = true }

[project.scripts]
rxn-bench-dosing-pump = "rxn_bench_dosing_pump._cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_dosing_pump"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament-lint",
    "-p", "no:ament-copyright",
    "-p", "no:ament-flake8",
    "-p", "no:ament-pep257",
    "-p", "no:ament-xmllint",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = "rxn_bench_dosing_pump"

[tool.coverage.run]
branch = true
source = ["rxn_bench_dosing_pump"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
disallow_untyped_defs = true
exclude = ["tests/", "docs/"]

[[tool.mypy.overrides]]
module = ["unitelabs.*"]
ignore_missing_imports = true
