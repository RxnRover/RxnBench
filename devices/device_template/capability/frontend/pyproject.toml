[project]
name = "rxn-bench-device-template-frontend"
version = "0.1.0"
description = "Reference device frontend plugin for Rxn Bench (widget + connection layer template)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "rxn-bench-ui",
]

[project.entry-points."rxn_bench.devices"]
device_template = "rxn_bench_device_template_frontend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_device_template_frontend"]
