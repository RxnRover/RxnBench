[project]
name = "rxn-bench-gantry-frontend"
version = "0.1.0"
description = "Gantry device frontend plugin for Rxn Bench (widget, workspace editor, connection layer)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "pyyaml>=6.0",
    "rxn-bench-ui",
]

[project.entry-points."rxn_bench.devices"]
gantry = "rxn_bench_gantry_frontend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_gantry_frontend"]
