name: ph_probe
display_name: Atlas Scientific pH Probe
sensor_type: ph

geometry:
  footprint_x: 44       # mm
  footprint_y: 25       # mm
  offset_x: 0           # mm, kept at 0 - do not hand-guess this; measure via the calibration
  offset_y: 0           # wizard instead, which folds the *entire* correction into tip_x/tip_y
                        # below and saves it locally (~/.rxn_bench/toolhead_calibration.json),
                        # not into this checked-in file.
  tip_x: 0              # mm
  tip_y: 0              # mm
  tip_offset_z: 0 #110     # mm, below carriage mount
  z_engage: 65          # mm, requested descent into a well. Actual descent is
                        # min((z_engage + well_depth)/2, well_depth - engage_bottom_margin),
                        # so this is blended with each well's depth and capped 2mm above
                        # its bottom. 65 keeps the probe junction submerged in the 25mL
                        # tubes (~71mm) and near the bottom of the shallower cal/wash wells.
  geometry_validated: false  # tip_x/tip_y are placeholders, not yet measured
