[project]
name = "rxn-bench-ph-sensor-frontend"
version = "0.1.0"
description = "pH sensor device frontend plugin for Rxn Bench (widget + connection layer)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "rxn-bench-ui",
]

[project.entry-points."rxn_bench.devices"]
ph_sensor = "rxn_bench_ph_sensor_frontend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_ph_sensor_frontend"]
