[project]
name = "rxn-bench-ph"
version = "0.1.0"
description = "pH sensor SiLA2 server capability for the Ames Lab rxn bench - hardware-agnostic; see rxn-bench-atlas-ezo-ph-driver for the reference driver."
requires-python = ">=3.10"
dependencies = [
    "unitelabs-cdk",
    "rxn-bench-atlas-ezo-ph-driver",
]

[project.optional-dependencies]
# Passthrough to the default driver's own rpi extra - keeps
# `pip install rxn-bench-ph[rpi]` working unchanged.
rpi = ["rxn-bench-atlas-ezo-ph-driver[rpi]"]

[tool.uv.sources]
# Not a workspace member (see rxn_bench_atlas_ezo_ph_driver's own pyproject.toml
# for why) - a plain editable path dependency instead, same pattern as
# rxn-bench-client in rxnbench/frontend/pyproject.toml.
rxn-bench-atlas-ezo-ph-driver = { path = "../../driver/backend", editable = true }

[project.scripts]
rxn-bench-ph = "rxn_bench_ph._cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_ph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament-lint",
    "-p", "no:ament-copyright",
    "-p", "no:ament-flake8",
    "-p", "no:ament-pep257",
    "-p", "no:ament-xmllint",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = "rxn_bench_ph"

[tool.coverage.run]
branch = true
source = ["rxn_bench_ph"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
disallow_untyped_defs = true
exclude = ["tests/", "docs/"]

[[tool.mypy.overrides]]
module = ["unitelabs.*"]
ignore_missing_imports = true
