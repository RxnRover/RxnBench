meta:
  device: ph_sensor
  package: rxn_bench_ph
  feature_class: PHSensor
  hardware_attr: _sensor
  originator: edu.iastate.ames
  category: rxnbench
  version: "1.0"
  maturity_level: Draft
  summary: Interface contract for pH sensors.

imports:
  - "from rxn_bench_ph.base_sensor import SensorReading"

protocols:
  - name: PHSensorProtocol
    core: true
    optional: false
    doc: Minimum interface required by the PHSensor SiLA feature.
    members:
      - name: read
        returns: SensorReading
        doc: Take a single measurement and return it as a SensorReading.
      - name: calibrate
        params:
          - {name: point, type: str}
          - {name: value, type: float}
        doc: Calibrate the probe at a known pH buffer.
      - name: slope
        returns: "tuple[float, float]"
        doc: Return (acid_pct, base_pct) slope percentages from the last calibration.
      - name: set_temperature
        params:
          - {name: temp, type: float}
        doc: Set the temperature-compensation value (deg C) for pH readings.
      - name: get_temperature
        returns: float
        doc: Return the current temperature-compensation value in degrees C.

feature_only: []
excluded_protocols: []
