[project]
name = "rxn-bench-ph"
version = "0.1.0"
description = "Atlas Scientific pH sensor SiLA2 server for the Ames Lab rxn bench."
requires-python = ">=3.10"
dependencies = [
    "unitelabs-cdk",
]

[project.optional-dependencies]
# Real-hardware transports on the Pi: smbus2 for the I2C path, pyserial for the
# UART path. Both are pure Python and small, so they're bundled together.
rpi = ["smbus2>=0.4.3", "pyserial>=3.5"]

[project.scripts]
rxn-bench-ph = "rxn_bench_ph._cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_ph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament-lint",
    "-p", "no:ament-copyright",
    "-p", "no:ament-flake8",
    "-p", "no:ament-pep257",
    "-p", "no:ament-xmllint",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = "rxn_bench_ph"

[tool.coverage.run]
branch = true
source = ["rxn_bench_ph"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
disallow_untyped_defs = true
exclude = ["tests/", "docs/"]

[[tool.mypy.overrides]]
module = ["unitelabs.*", "smbus2.*", "serial.*"]
ignore_missing_imports = true
