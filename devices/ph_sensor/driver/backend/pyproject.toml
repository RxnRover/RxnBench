[project]
name = "rxn-bench-atlas-ezo-ph-driver"
version = "0.1.0"
description = "Atlas Scientific EZO-pH driver for the rxn-bench-ph capability (I2C and UART transports)."
requires-python = ">=3.10"
dependencies = [
    "rxn-bench-ph",
]

[project.optional-dependencies]
# Real-hardware transports on the Pi: smbus2 for the I2C path, pyserial for the
# UART path. Both are pure Python and small, so they're bundled together.
rpi = ["smbus2>=0.4.3", "pyserial>=3.5"]

[project.entry-points."rxn_bench.ph_drivers"]
atlas_ezo = "rxn_bench_atlas_ezo_ph_driver:build_sensor"

[tool.uv.sources]
# Not a workspace member of rxnbench/backend (only the capability package is;
# this driver is reached transitively via the capability's own editable path
# dependency on it) - so this is a plain path reference, not workspace=true.
rxn-bench-ph = { path = "../../capability/backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_atlas_ezo_ph_driver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament-lint",
    "-p", "no:ament-copyright",
    "-p", "no:ament-flake8",
    "-p", "no:ament-pep257",
    "-p", "no:ament-xmllint",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = "rxn_bench_atlas_ezo_ph_driver"

[tool.coverage.run]
branch = true
source = ["rxn_bench_atlas_ezo_ph_driver"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
disallow_untyped_defs = true
exclude = ["tests/", "docs/"]

[[tool.mypy.overrides]]
module = ["smbus2.*", "serial.*", "rxn_bench_ph.*"]
ignore_missing_imports = true
