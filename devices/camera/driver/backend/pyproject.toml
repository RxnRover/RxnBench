[project]
name = "rxn-bench-crowsnest-camera-driver"
version = "0.1.0"
description = "Crowsnest webcam-stream driver for the rxn-bench-camera capability."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.entry-points."rxn_bench.camera_drivers"]
crowsnest = "rxn_bench_crowsnest_camera_driver:build_camera"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_crowsnest_camera_driver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament-lint",
    "-p", "no:ament-copyright",
    "-p", "no:ament-flake8",
    "-p", "no:ament-pep257",
    "-p", "no:ament-xmllint",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = "rxn_bench_crowsnest_camera_driver"

[tool.coverage.run]
branch = true
source = ["rxn_bench_crowsnest_camera_driver"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
disallow_untyped_defs = true
exclude = ["tests/", "docs/"]

[[tool.mypy.overrides]]
module = ["requests.*"]
ignore_missing_imports = true
