[project]
name = "rxn-bench-camera"
version = "0.1.0"
description = "Camera SiLA server for the Ames Lab automated chemistry bench (Crowsnest webcam stream)."
requires-python = ">=3.10"
dependencies = [
    "unitelabs-cdk",
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.scripts]
rxn-bench-camera = "rxn_bench_camera._cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_camera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament-lint",
    "-p", "no:ament-copyright",
    "-p", "no:ament-flake8",
    "-p", "no:ament-pep257",
    "-p", "no:ament-xmllint",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = "rxn_bench_camera"

[tool.coverage.run]
branch = true
source = ["rxn_bench_camera"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
disallow_untyped_defs = true
exclude = ["tests/", "docs/"]

[[tool.mypy.overrides]]
module = ["unitelabs.*", "requests.*", "yaml.*"]
ignore_missing_imports = true
