[project]
name = "chem-bench"
version = "0.1.0"
description = "Automated Chemistry Bench — SiLA2 server for the Ames Lab RPi controller."
requires-python = ">=3.10"
dependencies = [
    "unitelabs-cdk",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "zeroconf>=0.131.0",
]

[project.scripts]
chem-bench = "chem_bench._cli:main"

[project.optional-dependencies]
rpi = ["smbus2>=0.4.3"]

[dependency-groups]
dev = ["grpcio-tools>=1.60.0", "pytest>=8.0"]

[[tool.uv.index]]
name = "unitelabs"
url = "https://gitlab.com/api/v4/groups/1009252/-/packages/pypi/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chem_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament-lint",
    "-p", "no:ament-copyright",
    "-p", "no:ament-flake8",
    "-p", "no:ament-pep257",
    "-p", "no:ament-xmllint",
]
