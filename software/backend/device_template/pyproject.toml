# TODO: rename every occurrence of "template" / "mydevice" in this file.
#
# Checklist:
#   name            → chem-bench-<yourdevice>
#   description     → describe your device
#   script key      → chem-bench-<yourdevice>
#   script value    → chem_bench_<yourdevice>._cli:main
#   packages        → ["src/chem_bench_<yourdevice>"]
#   testpaths       → ["tests"]   (no changes needed)
#   Add any hardware-specific deps (e.g. smbus2, pyserial, minimalmodbus)

[project]
name = "chem-bench-template"
version = "0.1.0"
description = "TODO: one-line description of this device."
requires-python = ">=3.10"
dependencies = [
    "unitelabs-cdk",
    # TODO: add hardware dependencies here, e.g.:
    # "pyserial>=3.5",
    # "smbus2>=0.4.3",
]

[project.optional-dependencies]
# TODO: add optional hardware deps that only apply on specific platforms, e.g.:
# rpi = ["smbus2>=0.4.3"]

[project.scripts]
chem-bench-template = "chem_bench_template._cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chem_bench_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament-lint",
    "-p", "no:ament-copyright",
    "-p", "no:ament-flake8",
    "-p", "no:ament-pep257",
    "-p", "no:ament-xmllint",
]
