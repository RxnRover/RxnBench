[project]
name = "chem-bench-gantry"
version = "0.1.0"
description = "Gantry motion controller SiLA2 server for the Ames Lab chem bench."
requires-python = ">=3.10"
dependencies = [
    "unitelabs-cdk",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "zeroconf>=0.131.0",
]

[project.scripts]
chem-bench-gantry = "chem_bench_gantry._cli:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.60.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chem_bench_gantry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament-lint",
    "-p", "no:ament-copyright",
    "-p", "no:ament-flake8",
    "-p", "no:ament-pep257",
    "-p", "no:ament-xmllint",
]
