# 96-Well Standard Plate (ANSI/SBS 4-2004)
# Corning Costar 3599 reference dimensions.
# Verify origin offsets against physical plate stock before first use.
#
# Author: John Brittain
# Date: Jun 18 2026

name: 96_well_standard
display_name: 96-Well Standard
labware_type: well_plate

layout:
  rows: 8        # A–H
  columns: 12    # 1–12

dimensions:
  length: 127.76   # mm, long axis (X) — ANSI/SBS standard
  width:   85.48   # mm, short axis (Y) — ANSI/SBS standard
  height:  14.22   # mm, total plate height

well:
  diameter:   6.94   # mm, inner well diameter
  depth:     10.67   # mm, well depth from top surface
  volume_ul: 360.0   # µL, nominal working volume

spacing:
  row_spacing: 9.0   # mm, center-to-center (Y axis, A→B→…)
  col_spacing: 9.0   # mm, center-to-center (X axis, 1→2→…)

origin:              # well A1 center relative to plate bottom-left corner
  x: 14.38           # mm
  y: 11.24           # mm
