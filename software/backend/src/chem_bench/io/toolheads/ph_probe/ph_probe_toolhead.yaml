name: ph_probe
display_name: Atlas Scientific pH Probe
sensor_type: ph

geometry:
  footprint_x: 44       # mm, physical width of the toolhead body
  footprint_y: 25       # mm, physical depth of the toolhead body
  offset_x: 0           # mm, body centre from carriage mount in X
  offset_y: -35         # mm, body centre from carriage mount in Y
  tip_x: 0              # mm, probe tip from body centre in X 
  tip_y: -25              # mm, probe tip from body centre in Y 
  tip_offset_z: 110     # mm, how far the probe tip hangs below the carriage mount
  z_engage: 25          # mm, how far the probe lowers into the well when sampling
  requires_manual_z: true   # pH probe tip can't auto-home Z safely
  requires_manual_homing: false
