# 24-Well Standard Plate — ANSI/SLAS 4-2004
# Reference: Corning Costar 3524
# Verify origin offsets against physical plate stock before first use.

rows: 4           # A–D
columns: 6        # 1–6
spacing_mm: 19.3  # centre-to-centre, both axes
well_diameter_mm: 15.62
well_depth_mm: 17.4
a1_offset_x: 24.65   # mm from plate corner to A1 centre, X
a1_offset_y: 16.74   # mm from plate corner to A1 centre, Y
