[project]
name = "chem-bench-client"
version = "0.1.0"
description = "Blocking Python client for chem bench experiment scripts."
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chem_bench_client"]
