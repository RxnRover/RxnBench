[project]
name = "chem-bench-ph"
version = "0.1.0"
description = "Atlas Scientific pH sensor SiLA2 server for the Ames Lab chem bench."
requires-python = ">=3.10"
dependencies = [
    "unitelabs-cdk",
]

[project.optional-dependencies]
rpi = ["smbus2>=0.4.3"]

[project.scripts]
chem-bench-ph = "chem_bench_ph._cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chem_bench_ph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_testing_ros_pytest_entrypoint",
    "-p", "no:ament-lint",
    "-p", "no:ament-copyright",
    "-p", "no:ament-flake8",
    "-p", "no:ament-pep257",
    "-p", "no:ament-xmllint",
]
