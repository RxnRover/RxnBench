[project]
name = "chem-bench-ui"
version = "0.1.0"
description = "Desktop control UI for the Automated Chem Bench"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "grpcio>=1.60.0",
    "zeroconf>=0.131.0",
]

[project.scripts]
chem-bench-ui = "chem_bench_ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chem_bench_ui"]
