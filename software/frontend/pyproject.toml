[project]
name = "rxn-bench-ui"
version = "0.1.0"
description = "Desktop control UI for the Automated Rxn Bench"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "grpcio>=1.60.0",
    "protobuf>=6.33.5",
    "zeroconf>=0.131.0",
    "pyyaml>=6.0",
    "rxn-bench-client",
]

[tool.uv.sources]
rxn-bench-client = { path = "../backend/client", editable = true }

[project.scripts]
rxn-bench-ui = "rxn_bench_ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_ui"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = "rxn_bench_ui"

[tool.coverage.run]
branch = true
source = ["rxn_bench_ui"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
disallow_untyped_defs = true
exclude = ["docs/"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "grpc.*", "google.*", "zeroconf.*", "yaml.*", "rxn_bench_client.*"]
ignore_missing_imports = true
