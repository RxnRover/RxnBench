[project]
name = "rxn-bench-client"
version = "0.1.0"
description = "Blocking Python client for rxn bench experiment scripts."
requires-python = ">=3.10"
dependencies = [
    "sila2>=0.14.0",
    "zeroconf>=0.38",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_bench_client"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = "rxn_bench_client"

[tool.coverage.run]
branch = true
source = ["rxn_bench_client"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
disallow_untyped_defs = true
exclude = ["docs/"]

[[tool.mypy.overrides]]
module = ["sila2.*", "yaml.*", "zeroconf.*"]
ignore_missing_imports = true
